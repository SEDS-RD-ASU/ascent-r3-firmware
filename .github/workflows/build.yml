name: Locally build the esp-idf firmware.

on: [push]

jobs:
  build_and_flash:
    runs-on: [self-hosted, HITL]
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Code
        id: build
        run: |
          source /home/hitl/.espressif/tools/activate_idf_v6.1.sh 
          idf.py fullclean
          idf.py build
          